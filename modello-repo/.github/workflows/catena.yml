# La catena di agenti in questo progetto: un solo file, che richiama i workflow riutilizzabili
# di nikodips-tech/catena-agenti (tag v2). Qui ci sono solo gli eventi e le condizioni; tutta la
# logica sta nella catena. Configurazione del progetto: .catena.yml nella radice.
#
# Eventi:
#   issues labeled `auto`         → avvio (solo se la mette il proprietario)
#   issues labeled `retrospective-approved` → avvio: applica i consigli della retrospettiva (solo il proprietario)
#   issue_comment del proprietario su un'issue `turn-human` → avvio (la risposta fa ripartire)
#   workflow_dispatch             → un passo della catena (lo usano gli script, o un avvio a mano)
#   workflow_run della CI         → unione delle pull request con `unione-automatica`
#   pull_request closed           → ordine dopo un'unione o una chiusura fatta a mano
#   schedule                      → guardiano: riprende le issue ferme, avvia la coda
#
# I permessi stanno sui job: un workflow riutilizzabile può solo ridurre quelli che riceve.
name: Catena
run-name: "Catena: ${{ github.event_name == 'workflow_dispatch' && format('{0} #{1}', inputs.passo, inputs.issue) || github.event_name }}"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      passo:
        description: Passo della catena
        type: choice
        options: [avvio, team-leader, developer, revisore, editor, chiusura, retrospettiva, applica, chiusura-retrospettiva]
        required: true
      issue:
        description: Numero dell'issue principale
        type: string
        required: true
      sottotask:
        description: Numero del sotto-task (se il passo lo richiede)
        type: string
        default: ""
      tentativo:
        description: Tentativo del developer
        type: string
        default: "1"
      nota:
        description: Testo per l'agente (lo riempiono gli script)
        type: string
        default: ""
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 * * * *"

permissions: {}

jobs:
  avvio:
    if: >-
      (github.event_name == 'issues' && contains(fromJSON('["auto","retrospective-approved"]'), github.event.label.name)) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'turn-human') &&
       github.event.comment.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_dispatch' && inputs.passo == 'avvio')
    concurrency:
      group: catena-avvio
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: write
      pull-requests: read
    uses: nikodips-tech/catena-agenti/.github/workflows/avvio.yml@v2
    with:
      issue: ${{ github.event.issue.number || inputs.issue }}
      evento: ${{ github.event_name == 'issues' && 'etichetta' || github.event_name == 'issue_comment' && 'commento' || 'dispatch' }}
      chi: ${{ github.event.sender.login }}
      etichetta: ${{ github.event.label.name }}
    secrets: inherit

  agente:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["team-leader","developer","revisore","editor","retrospettiva","applica"]'), inputs.passo)
    permissions:
      contents: write
      issues: write
      actions: write
      pull-requests: write
      packages: read   # il container su ghcr.io, anche privato
    uses: nikodips-tech/catena-agenti/.github/workflows/agente.yml@v2
    with:
      ruolo: ${{ inputs.passo }}
      issue: ${{ inputs.issue }}
      sottotask: ${{ inputs.sottotask }}
      tentativo: ${{ inputs.tentativo }}
      nota: ${{ inputs.nota }}
    secrets: inherit

  chiusura:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["chiusura","chiusura-retrospettiva"]'), inputs.passo)
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: nikodips-tech/catena-agenti/.github/workflows/chiusura.yml@v2
    with:
      issue: ${{ inputs.issue }}
      retrospettiva: ${{ inputs.passo == 'chiusura-retrospettiva' }}
    secrets: inherit

  unione:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')
    concurrency:
      group: catena-unione-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    uses: nikodips-tech/catena-agenti/.github/workflows/unione.yml@v2
    with:
      ramo: ${{ github.event.workflow_run.head_branch }}
      sha: ${{ github.event.workflow_run.head_sha }}
      esito: ${{ github.event.workflow_run.conclusion }}
      run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit

  pr-chiusa:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      issues: write
      actions: write
    uses: nikodips-tech/catena-agenti/.github/workflows/pr-chiusa.yml@v2
    with:
      pr: ${{ github.event.pull_request.number }}
      ramo: ${{ github.event.pull_request.head.ref }}
      base: ${{ github.event.pull_request.base.ref }}
      unita: ${{ github.event.pull_request.merged }}
    secrets: inherit

  guardiano:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
      actions: write
    uses: nikodips-tech/catena-agenti/.github/workflows/guardiano.yml@v2
    secrets: inherit
