# CI minima per un progetto Node senza CI: lint, tipi, test e build come job separati (i nomi
# dei job sono i controlli obbligatori del ruleset: lint, tipi, test, build app), nello stesso
# container dei controlli della catena. Si adatta cambiando immagine, cartella e comandi,
# che devono coincidere con .catena.yml. Gli e2e, se esistono, solo a mano con e2e=si.
#
# I job obbligatori devono girare anche con workflow_dispatch: così si può rilanciare la CI
# su un ramo e la catena (workflow_run) la riconosce.
name: CI

on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      e2e:
        description: Esegui anche gli e2e
        type: choice
        options: ["no", "si"]
        default: "no"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  controlli:
    name: ${{ matrix.controllo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - controllo: lint
            comando: npm run lint && npm run format:check
          - controllo: tipi
            comando: npm run typecheck
          - controllo: test
            comando: npm test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ${{ matrix.controllo }}
        run: docker run --rm -v "$PWD/app:/app" -w /app node:22-alpine sh -c "npm ci --no-audit --no-fund && ${{ matrix.comando }}"

  build:
    name: build app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          file: app/Dockerfile
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "qui gli e2e del progetto (Playwright, Cypress…), mai obbligatori"
